<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0a1420"/>

  <!-- Top gold stripe -->
  <rect x="0" y="0" width="1200" height="5" fill="#c09a2f"/>

  <!-- Left vertical accent -->
  <rect x="80" y="80" width="2" height="470" fill="#c09a2f" opacity="0.35"/>

  <!-- Right decorative grid lines -->
  <line x1="900" y1="80" x2="900" y2="550" stroke="#1b3554" stroke-width="1"/>
  <line x1="1000" y1="80" x2="1000" y2="550" stroke="#1b3554" stroke-width="1"/>
  <line x1="1100" y1="80" x2="1100" y2="550" stroke="#1b3554" stroke-width="1"/>
  <line x1="900" y1="200" x2="1200" y2="200" stroke="#1b3554" stroke-width="1"/>
  <line x1="900" y1="350" x2="1200" y2="350" stroke="#1b3554" stroke-width="1"/>
  <line x1="900" y1="480" x2="1200" y2="480" stroke="#1b3554" stroke-width="1"/>

  <!-- Diagonal accent top-right -->
  <polygon points="1050,0 1200,0 1200,150" fill="#1b3554" opacity="0.6"/>

  <!-- Company name -->
  <text x="112" y="230" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="400" fill="#f5f3ee" letter-spacing="-2">Essor Consulting</text>

  <!-- Gold rule -->
  <rect x="112" y="256" width="160" height="2" fill="#c09a2f"/>

  <!-- Tagline line 1 -->
  <text x="112" y="316" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="300" fill="#c09a2f" letter-spacing="1">Cabinet Conseil Supply Chain &amp; Logistique</text>

  <!-- Tagline line 2 -->
  <text x="112" y="352" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="300" fill="#c09a2f" opacity="0.8">Maroc</text>

  <!-- Separator dots -->
  <circle cx="112" cy="420" r="3" fill="#c09a2f" opacity="0.5"/>
  <circle cx="124" cy="420" r="3" fill="#c09a2f" opacity="0.3"/>
  <circle cx="136" cy="420" r="3" fill="#c09a2f" opacity="0.15"/>

  <!-- Stats -->
  <text x="112" y="462" font-family="'Courier New', Courier, monospace" font-size="17" fill="#f5f3ee" opacity="0.45" letter-spacing="1">110+ missions  ·  15 ans d'expérience  ·  Casablanca</text>

  <!-- Bottom domain -->
  <text x="112" y="568" font-family="'Courier New', Courier, monospace" font-size="14" fill="#c09a2f" opacity="0.55" letter-spacing="2">essor-consulting.vercel.app</text>

  <!-- Bottom gold stripe -->
  <rect x="0" y="624" width="1200" height="6" fill="#1b3554"/>
</svg>
